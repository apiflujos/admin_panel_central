services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin-central-olivashoes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin-central-olivashoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3006:3006"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/admin-central-olivashoes
      REDIS_URL: redis://redis:6379
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    ports:
      - "3100:3100"
    environment:
      APP_HOST: http://app:3006
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
